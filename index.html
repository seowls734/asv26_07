<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>삼겹살 파이터 — 철판 대난투</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 40px #000}
#r{position:absolute;left:0;top:0;color:#fff;background:#000c;font:12px monospace;margin:0;padding:8px;white-space:pre-wrap}
#pad{position:fixed;top:0;bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);pointer-events:none;display:none;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
#pad .b{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;text-align:center;line-height:1.1;text-shadow:0 1px 2px #000}
#pad .b.on{background:rgba(255,200,80,.55)}
#pad .c{border-radius:14px;background:rgba(255,120,80,.28)}
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="pad"></div>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, GROUND = 460, ROUND_T = 60 * 60, GRAV = 0.75;
const FONT = "'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";
const TOUCH = ('ontouchstart' in window) || (window.matchMedia && matchMedia('(pointer: coarse)').matches);
// 화면 맞추기: PC는 비율 유지(여백), 모바일 가로는 화면을 꽉 채움, 모바일 세로는 위쪽 게임 화면 + 아래쪽 조작 버튼
let PORTRAIT = false, padReady = false;
function fit() {
  const vw = innerWidth, vh = innerHeight;
  PORTRAIT = TOUCH && vh > vw;
  let w, h;
  if (PORTRAIT) { w = vw; h = Math.min(vw * H / W, vh * 0.55); }
  else if (TOUCH) { w = vw; h = vh; }
  else { const s = Math.min(vw / W, vh / H); w = W * s; h = H * s; }
  Object.assign(cv.style, { width: w + 'px', height: h + 'px', top: PORTRAIT ? '0' : '50%', transform: PORTRAIT ? 'translate(-50%,0)' : 'translate(-50%,-50%)' });
  // 실제 화면 픽셀에 맞춰 캔버스 해상도를 올림 (흐릿함 방지). 휴대폰 성능을 위해 최대 2배
  const r = Math.min(2, Math.max(1, Math.max(w / W, h / H) * (window.devicePixelRatio || 1)));
  if (Math.abs(r - RES) > 0.01) { RES = r; cv.width = Math.round(W * RES); cv.height = Math.round(H * RES); ctx.imageSmoothingQuality = 'high'; }
  if (padReady) layoutPad(h);
}
let RES = 1;
addEventListener('resize', fit); addEventListener('orientationchange', () => setTimeout(fit, 200));
// 모바일 웹: 첫 터치 때 전체 화면(지원하는 브라우저만), 길게 눌러 메뉴 뜨는 것 막기, 앱 전환 시 소리 멈춤
if (TOUCH) addEventListener('pointerdown', () => { const d = document.documentElement; if (!document.fullscreenElement && d.requestFullscreen) d.requestFullscreen({ navigationUI: 'hide' }).catch(() => {}); }, { once: true });
addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { try { if (typeof AC !== 'undefined' && AC) document.hidden ? AC.suspend() : AC.resume(); } catch (e) {} });

// ================= utils =================
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = k => 1 - Math.pow(1 - clamp(k), 3);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.random() * arr.length | 0];
// 게임 결과에 영향을 주는 난수는 시드 난수로 (온라인에서 두 화면이 똑같이 진행되도록)
let seedS = 1;
function sseed(n) { seedS = (n >>> 0) || 1; }
function srnd() { seedS = seedS + 0x6D2B79F5 | 0; let t = Math.imul(seedS ^ seedS >>> 15, 1 | seedS); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }
const srand = (a, b) => a + srnd() * (b - a);
const spick = arr => arr[srnd() * arr.length | 0];
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ell(x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, Math.PI * 2); }
function poly(pts) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function txt(s, x, y, size, fill, stroke = '#000', lw = 6, align = 'center') {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.strokeText(s, x, y); }
  ctx.fillStyle = fill; ctx.fillText(s, x, y);
}
function bubble(x, y, s, size = 26) {
  ctx.font = `900 ${size}px ${FONT}`;
  const w = ctx.measureText(s).width + 34, h = size + 26;
  ctx.fillStyle = '#fff'; ctx.strokeStyle = '#000'; ctx.lineWidth = 3;
  poly([[x + w * 0.12, y + h / 2 - 2], [x + w * 0.4, y + h / 2 + 26], [x + w * 0.3, y + h / 2 - 2]]); ctx.fill(); ctx.stroke();
  rr(x - w / 2, y - h / 2, w, h, 16); ctx.fill(); ctx.stroke();
  ctx.fillRect(x + w * 0.12 + 2, y + h / 2 - 4, w * 0.18 - 3, 5);
  txt(s, x, y, size, '#000', null);
}
// 받침 유무로 은/는, 이/가 선택
function josa(name, a, b) { const c = name.charCodeAt(name.length - 1); if (c < 0xAC00 || c > 0xD7A3) return name + b; return name + ((c - 0xAC00) % 28 ? a : b); }

// ================= input =================
const keys = {}, pressed = {}, lastPress = {};
function press(code) { if (!keys[code]) { pressed[code] = true; lastPress[code] = gT; } keys[code] = true; }
addEventListener('keydown', e => {
  if (!e.repeat) { pressed[e.code] = true; lastPress[e.code] = gT; }
  keys[e.code] = true; initAudio();
  if (e.code.startsWith('Arrow') || e.code === 'Space' || e.code.startsWith('Numpad')) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const MAP1 = { left: 'KeyA', right: 'KeyD', up: 'KeyW', down: 'KeyS', lp: 'KeyI', rp: 'KeyO', lk: 'KeyK', rk: 'KeyL', grab: 'KeyJ', skill: 'KeyU' };
const MAP2 = { left: 'ArrowLeft', right: 'ArrowRight', up: 'ArrowUp', down: 'ArrowDown', lp: 'Numpad7', rp: 'Numpad8', lk: 'Numpad4', rk: 'Numpad5', grab: 'Numpad1', skill: 'Numpad9' };
const EMPTY = { left: false, right: false, up: false, down: false, leftP: false, rightP: false, lp: false, rp: false, lk: false, rk: false, grab: false, skill: false, ult: false, adCmd: false, cpu: false, mash: false, n1: false, n2: false, n3: false, ok: false };
// 두 키를 거의 동시에(6프레임 이내) 눌렀는지
function chord(a, b) { return !!(keys[a] && keys[b] && (pressed[a] || pressed[b]) && Math.abs((lastPress[a] ?? -99) - (lastPress[b] ?? -99)) <= 6); }
function readInput(m) {
  const o = { left: !!keys[m.left], right: !!keys[m.right], down: !!keys[m.down], up: !!pressed[m.up], leftP: !!pressed[m.left], rightP: !!pressed[m.right] };
  for (const b of ['lp', 'rp', 'lk', 'rk']) o[b] = !!pressed[m[b]];
  o.grab = !!pressed[m.grab] || chord(m.lp, m.lk) || chord(m.rp, m.rk);   // I+K / O+L = 업어치기
  o.skill = !!pressed[m.skill] || chord(m.lk, m.rk);                       // K+L = 스킬
  o.adCmd = chord(m.left, m.right);                                         // A+D = 필살 준비
  o.ult = chord(m.lk, m.rp);                                                // (A+D 후) K+O = 필살기
  o.cpu = false;
  for (let n = 1; n <= 3; n++) o['n' + n] = !!(pressed['Digit' + n] || pressed['Numpad' + n]);
  o.ok = !!(pressed.Enter || pressed.Space);
  o.mash = o.lp || o.rp || o.lk || o.rk;
  return o;
}
function orInput(a, b) { const o = {}; for (const k in a) o[k] = a[k] || b[k]; return o; }

// ---- 화면 탭(메뉴용 핫스팟) ----
let hot = [];
function addHot(x, y, w, h, fn) { hot.push({ x, y, w, h, fn }); }
cv.addEventListener('pointerdown', e => {
  initAudio();
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  for (let i = hot.length - 1; i >= 0; i--) { const h = hot[i]; if (x >= h.x && x <= h.x + h.w && y >= h.y && y <= h.y + h.h) { h.fn(); e.preventDefault(); return; } }
});

// ---- 모바일 터치 패드 ----
const PAD = [
  { t: '◀', codes: ['KeyA'], l: 3, b: 22, s: 64 }, { t: '▶', codes: ['KeyD'], l: 19, b: 22, s: 64 },
  { t: '▲', codes: ['KeyW'], l: 11, b: 40, s: 60 }, { t: '▼<br>앉기', codes: ['KeyS'], l: 11, b: 4, s: 60 },
  { t: 'I<br>왼손', codes: ['KeyI'], r: 15, b: 30, s: 62 }, { t: 'O<br>오른손', codes: ['KeyO'], r: 4, b: 38, s: 62 },
  { t: 'K<br>왼발', codes: ['KeyK'], r: 15, b: 8, s: 62 }, { t: 'L<br>오른발', codes: ['KeyL'], r: 4, b: 16, s: 62 },
  { t: '업어<br>치기', codes: ['KeyI', 'KeyK'], r: 27, b: 6, s: 56, c: 1 }, { t: '스킬', codes: ['KeyK', 'KeyL'], r: 27, b: 26, s: 56, c: 1 },
  { t: '필살기', codes: ['KeyA', 'KeyD', 'KeyK', 'KeyO'], r: 27, b: 46, s: 56, c: 1 }
];
// 세로 화면 배치: [가운데 x, 가운데 y, 크기] — 단위 u 기준 (왼쪽 십자키 · 가운데 조합기 · 오른쪽 손발)
const PAD_PORTRAIT = [[-1, 0, .9], [1, 0, .9], [0, -1, .9], [0, 1, .9],
  ['r', -2.25, -.6, 1], ['r', -1.15, -.6, 1], ['r', -2.25, .6, 1], ['r', -1.15, .6, 1],
  ['m', -1.05, .85], ['m', 0, .85], ['m', 1.05, .85]];
const padEl = document.getElementById('pad');
function layoutPad(canvasH) {
  if (!TOUCH) return;
  if (!PORTRAIT) {   // 가로: 화면 위에 겹쳐서
    padEl.style.top = '0';
    const k = Math.max(0.7, Math.min(1.15, innerHeight / 430));   // 작은 폰은 버튼도 작게
    for (const p of PAD) {
      Object.assign(p.el.style, { width: p.s * k + 'px', height: p.s * k + 'px', top: '', bottom: p.b + '%', left: p.l !== undefined ? p.l + '%' : '', right: p.l === undefined ? p.r + '%' : '' });
    }
    return;
  }
  // 세로: 게임 화면 아래 남는 공간에
  padEl.style.top = canvasH + 'px';
  const w = innerWidth, ph = innerHeight - canvasH;
  const u = Math.min((w - 16) / 7, ph / 3.6, 80), cy = ph * 0.55, lx = 1.45 * u + 8, mx = (2.9 * u + 8 + w - 2.75 * u) / 2;
  PAD.forEach((p, i) => {
    const q = PAD_PORTRAIT[i]; let x, y, s;
    if (q[0] === 'r') { x = w + q[1] * u; y = cy + q[2] * u; s = q[3] * u; }
    else if (q[0] === 'm') { x = mx; y = cy + q[1] * u; s = q[2] * u; }
    else { x = lx + q[0] * u; y = cy + q[1] * u; s = q[2] * u; }
    Object.assign(p.el.style, { width: s + 'px', height: s + 'px', left: x - s / 2 + 'px', top: y - s / 2 + 'px', right: '', bottom: '' });
  });
}
for (const p of PAD) {
  const d = document.createElement('div'); d.className = 'b' + (p.c ? ' c' : ''); d.innerHTML = p.t; p.el = d;
  const down = e => { e.preventDefault(); initAudio(); d.classList.add('on'); for (const c of p.codes) press(c); d.setPointerCapture?.(e.pointerId); };
  const up = e => { e.preventDefault(); d.classList.remove('on'); for (const c of p.codes) keys[c] = false; };
  d.addEventListener('pointerdown', down); d.addEventListener('pointerup', up); d.addEventListener('pointercancel', up);
  padEl.appendChild(d);
}
padReady = true; fit();
let padShown = false;
function syncPad() {
  const want = TOUCH && ['intro', 'fight', 'roundEnd'].includes(scene);
  if (want !== padShown) { padShown = want; padEl.style.display = want ? 'block' : 'none'; }
}

// ================= audio =================
let AC = null, master = null, noiseBuf = null;
function initAudio() {
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(AC.destination);
    master = AC.createGain(); master.gain.value = 0.55; master.connect(comp);
    rev = AC.createConvolver(); rev.buffer = makeImpulse(1.8);
    const rg = AC.createGain(); rg.gain.value = 0.25; rev.connect(rg); rg.connect(comp);
    const send = AC.createGain(); send.gain.value = 0.12; master.connect(send); send.connect(rev);
    music = AC.createGain(); music.gain.value = 0; music.connect(comp);
    const ms = AC.createGain(); ms.gain.value = 0.3; music.connect(ms); ms.connect(rev);
  } catch (e) { AC = null; }
}
function tone(f, d, type = 'square', v = 0.2, f2) {
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, n);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, n + d);
  g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.001, n + d);
  o.connect(g); g.connect(master); o.start(n); o.stop(n + d);
}
function getNoise() {
  if (!noiseBuf) { noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return noiseBuf;
}
function noise(d, v = 0.3, freq = 1000, type = 'lowpass') {
  if (!AC) return;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), n = AC.currentTime;
  s.buffer = getNoise(); f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(v, n); g.gain.exponentialRampToValueAtTime(0.001, n + d);
  s.connect(f); f.connect(g); g.connect(master); s.start(n); s.stop(n + d);
}
const SFX = {
  punch() { noise(0.025, 0.5, 5000, 'highpass'); noise(0.1, 0.5, 1400); tone(140 + Math.random() * 30, 0.12, 'sine', 0.4, 60); },
  kick() { noise(0.03, 0.6, 4000, 'highpass'); noise(0.2, 0.6, 800); tone(110 + Math.random() * 20, 0.22, 'sine', 0.55, 38); },
  block() { tone(1200, 0.08, 'triangle', 0.15, 800); tone(1800, 0.05, 'square', 0.04); noise(0.05, 0.25, 5000, 'highpass'); },
  whiff() { noise(0.08, 0.1, 3000, 'bandpass'); },
  jump() { tone(300, 0.12, 'sine', 0.12, 600); },
  special() { tone(200, 0.4, 'sawtooth', 0.15, 800); },
  oink() { tone(420, 0.12, 'sawtooth', 0.15, 250); setTimeout(() => tone(380, 0.18, 'sawtooth', 0.15, 200), 130); },
  squeal() { tone(900, 0.6, 'sawtooth', 0.15, 1600); },
  ko() { tone(400, 0.8, 'square', 0.2, 60); noise(0.5, 0.4, 600); },
  chop() { noise(0.1, 0.6, 2500); tone(90, 0.12, 'square', 0.3, 40); },
  snip() { tone(2400, 0.04, 'square', 0.08); noise(0.04, 0.2, 5000, 'highpass'); },
  bell() { tone(880, 0.3, 'triangle', 0.2); setTimeout(() => tone(1320, 0.4, 'triangle', 0.2), 120); },
  tick() { tone(1000, 0.05, 'square', 0.08); },
  gong() { tone(196, 1.4, 'sine', 0.35); tone(392, 1.1, 'triangle', 0.12); tone(587, 0.8, 'sine', 0.08); },
  ultStart() { tone(150, 0.7, 'sawtooth', 0.18, 700); noise(0.5, 0.3, 800); },
  transform() { tone(300, 0.5, 'square', 0.12, 1200); tone(450, 0.5, 'triangle', 0.12, 1800); },
  fire() { noise(0.25, 0.35, 1200, 'bandpass'); tone(160, 0.2, 'sawtooth', 0.1, 90); },
  ice() { tone(1800, 0.25, 'triangle', 0.12, 2600); noise(0.15, 0.15, 6000, 'highpass'); },
  slam() { tone(70, 0.4, 'sine', 0.5, 35); noise(0.3, 0.5, 400); },
  thud() { tone(90, 0.15, 'sine', 0.3, 50); noise(0.1, 0.25, 500); },
  tender() { tone(140 + Math.random() * 40, 0.06, 'square', 0.15, 80); noise(0.05, 0.3, 1200); },
  partBreak() { tone(600, 0.15, 'square', 0.15, 300); noise(0.2, 0.4, 2000); },
  stamp() { tone(80, 0.3, 'square', 0.35, 40); noise(0.2, 0.5, 700); },
  hot() { noise(0.15, 0.12, 4000, 'highpass'); },
  select() { tone(660, 0.06, 'square', 0.08); },
  confirm() { tone(523, 0.1, 'square', 0.12); setTimeout(() => tone(784, 0.15, 'square', 0.12), 80); }
};
let sizzleNode = null, sizzleGain = null;
function sizzleOn() {
  if (!AC || sizzleNode) return;
  sizzleNode = AC.createBufferSource(); sizzleNode.buffer = getNoise(); sizzleNode.loop = true;
  const f = AC.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 3500;
  sizzleGain = AC.createGain(); sizzleGain.gain.value = 0;
  sizzleNode.connect(f); f.connect(sizzleGain); sizzleGain.connect(master); sizzleNode.start();
}
function sizzleSet(v) { if (sizzleGain) sizzleGain.gain.setTargetAtTime(v, AC.currentTime, 0.05); }
function sizzleOff() { if (sizzleNode) { try { sizzleNode.stop(); } catch (e) {} } sizzleNode = null; sizzleGain = null; }

// ================= characters =================
const look = (body, dark, belly, snout, hoof, brow, band, acc, bw = 1) => ({ body, dark, belly, snout, hoof, brow, band, acc, bw });
const CHARS = [
  { name: '분홍이', title: '근본 삼겹살', type: '밸런스', hp: 100, power: 1.0, speed: 1.0, scale: 1.15,
    look: look('#ffb5c5', '#d9718c', '#ffd6df', '#ff93ac', '#7a3b4a', '#5a2030', '#e53935', ['band']),
    skill: { name: '돼지 박치기', type: 'dash', cd: 150, desc: '머리부터 돌진' },
    tf: { name: '불꽃 분홍', type: 'fire', color: '#ff5722', desc: '공격력↑ · 화상' },
    ult: { name: '삼겹 폭풍 연타', type: 'rush', desc: '돌진 후 폭풍 연타' } },
  { name: '깜돌이', title: '제주 흑돼지', type: '파워', hp: 110, power: 1.15, speed: 0.9, scale: 1.2,
    look: look('#4b3d44', '#1f181b', '#62525a', '#7d6670', '#0d090b', '#0a0a0a', '#1e88e5', ['band', 'scar']),
    skill: { name: '흑돼지 어깨치기', type: 'armorShoulder', cd: 170, desc: '슈퍼아머 돌진' },
    tf: { name: '한라산 돌돼지', type: 'stone', color: '#9e9e9e', desc: '받는 피해↓ · 슈퍼아머' },

// ================= particles =================
let parts = [], texts = [];
function burst(x, y, n, cols, spd = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(spd * 0.3, spd);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: rand(15, 30), max: 30, c: cols[i % cols.length], s: rand(2, 5), g: 0.35, type: 'dot', glow: true });
  }
}
function smoke(x, y, c = '220,220,220') { parts.push({ x, y, vx: rand(-0.4, 0.4), vy: rand(-1.8, -0.8), life: rand(50, 90), max: 90, c, s: rand(8, 16), g: -0.005, type: 'smoke' }); }
function smokePuff(x, y) { for (let i = 0; i < 10; i++) smoke(x + rand(-30, 30), y + rand(-40, 40), '120,100,150'); }
function flame(x, y) { parts.push({ x, y, vx: rand(-0.6, 0.6), vy: rand(-2.5, -1), life: rand(15, 25), max: 25, c: pick(['#ff9800', '#ffeb3b', '#ff5722']), s: rand(3, 6), g: -0.05, type: 'dot', glow: true }); }
function slash(x, y) { parts.push({ x, y, a: rand(0, Math.PI), len: rand(80, 160), life: 12, max: 12, type: 'slash', vx: 0, vy: 0, g: 0 }); }
function popText(x, y, s, c, size = 36) { texts.push({ x, y, s, c, size, life: 50, max: 50 }); }
function updParts() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--; if (p.type === 'smoke') { p.s += 0.35; p.vx *= 0.99; } if (p.type === 'ring') p.r += 4.5; }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 600) parts.splice(0, parts.length - 600);
  for (const t of texts) { t.life--; t.y -= 0.6; }
  texts = texts.filter(t => t.life > 0);
}
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / p.max);
    if (p.type === 'smoke') { ctx.fillStyle = `rgba(${p.c},${a * 0.35})`; ell(p.x, p.y, p.s, p.s); ctx.fill(); }
    else if (p.type === 'slash') {
      ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 4 * a + 1;
      const dx = Math.cos(p.a) * p.len / 2, dy = Math.sin(p.a) * p.len / 2;
      line(p.x - dx, p.y - dy, p.x + dx, p.y + dy);
    } else if (p.type === 'ring') { ctx.strokeStyle = `rgba(${p.c},${a})`; ctx.lineWidth = 6 * a + 1; ell(p.x, p.y, p.r, p.r * 0.8); ctx.stroke(); }
    else {
      ctx.globalAlpha = a; if (p.glow) ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = p.c; ell(p.x, p.y, p.s, p.s); ctx.fill();
      if (p.glow) { ctx.globalAlpha = a * 0.3; ell(p.x, p.y, p.s * 2.4, p.s * 2.4); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }
      ctx.globalAlpha = 1;
    }

  }
  for (const t of texts) {
    const k = 1 - t.life / t.max;
    const sc = k < 0.15 ? 0.5 + k / 0.15 * 0.7 : 1.2 - Math.min(0.2, k - 0.15);
    ctx.save(); ctx.globalAlpha = clamp(t.life / 15); ctx.translate(t.x, t.y); ctx.scale(sc, sc); ctx.rotate(-0.08);
    txt(t.s, 0, 0, t.size, t.c, '#000', 7); ctx.restore();

}

  ctx.fillStyle = hc || C.hoof; ell(x2, y2, hr || w / 2 + 1, hr || w / 2 + 1); ctx.fill();

  for (const o of objs) if (o.owner === op && o.dmg && !o.delay && Math.abs(o.x - me.x) < 180 && Math.random() < 0.1) {

  if (--ai.think <= 0) {

    const r = Math.random();

    else if (me.skillCD <= 0 && r < 0.35 && skillGood(me.ch.skill.type, dist, op)) inp.skill = true;
    else if (dist < 130 && r < 0.12) inp.grab = true;
    else if (dist < 200) {
      const q = Math.random();
      if (q < 0.22) inp.lp = true; else if (q < 0.42) inp.rp = true; else if (q < 0.58) inp.lk = true; else if (q < 0.72) inp.rk = true;
      else if (q < 0.8) { inp.down = true; inp[pick(['lp', 'rp', 'lk', 'rk'])] = true; }
      else if (q < 0.9) ai.move = -dir * 16; else inp.up = true;
    } else { ai.move = dir * (14 + (Math.random() * 24 | 0)); if (r < 0.06) inp.up = true; }
  }
  if (ai.move !== 0) { const sg = Math.sign(ai.move); inp[sg > 0 ? 'right' : 'left'] = true; ai.move -= sg; }
  return inp;
}

  return Math.max(5, Math.round(base * fitM * starM * trend(d.k, per) * Math.sqrt(trend(d.m, per)) * (hotMethod(per) === d.k ? 1.8 : 1)));
}

const shadeCache = new Map();
function tintHex(hex, k) {
  const key = hex + k; if (shadeCache.has(key)) return shadeCache.get(key);
  let out = hex;
  if (/^#[0-9a-f]{6}$/i.test(hex)) {
    const n = parseInt(hex.slice(1), 16), c = [n >> 16, n >> 8 & 255, n & 255].map(v => Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k)));
    out = `rgb(${c.join(',')})`;
  }
  shadeCache.set(key, out); return out;
}
function shadeFill(col, x, y, r) {
  if (!/^#[0-9a-f]{6}$/i.test(col)) return col;
  const g = ctx.createRadialGradient(x, y, 2, x + r * 0.3, y + r * 0.4, r * 1.5);
  g.addColorStop(0, tintHex(col, 0.35)); g.addColorStop(0.5, col); g.addColorStop(1, tintHex(col, -0.15));
  return g;
}
function drawPortrait(cx, cy, r, C, face) {

  drawPig(cx - 18 * face, cy + 47, face, C, { scale: 0.52, t: gT });

}

const DEBT_START = 10000;
let debt = lsGet('sgf_debt', DEBT_START), bankDebt = lsGet('sgf_bank', 0);
// 상환 목표: 처음엔 사채 10,000. 빚을 다 갚은 뒤 다시 빌리면 그 금액이 새 목표가 됨
let debtBase = lsGet('sgf_debtbase', DEBT_START);
const totalDebt = () => Math.max(0, debt) + Math.max(0, bankDebt);
const repaidRatio = () => clamp(1 - totalDebt() / Math.max(1, debtBase));
const saveDebt = () => { lsSet('sgf_debt', debt); lsSet('sgf_bank', bankDebt); lsSet('sgf_debtbase', debtBase); };
const netWorth = () => coins - debt - bankDebt;
const loanLimit = () => Math.max(0, 200 * (tierOf(tp) + 1) - bankDebt);   // 티어가 오를수록 한도↑
function repay(which, amt) {
  const owe = which === 'debt' ? debt : bankDebt;
  amt = Math.floor(Math.min(amt, coins - 1, owe));   // 어떤 상환이든 1코인은 남김 (0이면 배드 엔딩)
  if (amt <= 0) { SFX.block(); toast(owe <= 0 ? '갚을 빚이 없어요' : '코인이 없어요'); return; }
  addCoins(-amt);
  if (which === 'debt') debt -= amt; else bankDebt -= amt;
  saveDebt(); SFX.coin(); popText(680, 470, `${fmtN(amt)}코인 상환!`, '#69f0ae', 30);
  uploadRank(); checkChapters();
}
function borrow(amt) {
  amt = Math.floor(Math.min(amt, loanLimit()));
  if (amt <= 0) { SFX.block(); toast('대출 한도 초과! 티어를 올리면 한도가 늘어요'); return; }
  const owe = Math.round(amt * 1.1), fresh = totalDebt() <= 0;
  addCoins(amt); bankDebt += owe;
  if (fresh) {   // 빚 0에서 새로 빌림 → 이 대출이 새 상환 목표, 다 갚으면 빚 청산 엔딩을 다시 볼 수 있음
    debtBase = owe; chapSeen = chapSeen.filter(k => k !== 'ending'); lsSet('sgf_chap', chapSeen);
  } else debtBase += owe;   // 갚는 중에 더 빌리면 목표에 더함
  saveDebt(); SFX.coin();
  toast(`${fmtN(amt)}코인 대출! 갚을 돈 ${fmtN(owe)} (수수료 10%)`); uploadRank();
}
// ---- 랭크 점수 (다른 대전 게임처럼) ----
// · 티어가 높을수록 이기면 덜 오르고, 지면 더 많이 깎임
// · 다음 티어 문턱에 닿으면 바로 못 올라가고 '승급전'(3판 2선승)을 이겨야 승급. 지면 문턱 아래로 밀려남
let promo = lsGet('sgf_promo', null);   // { w, l } 승급전 진행 중일 때만
const winTP = (i, online) => (online ? Math.max(8, 20 - i) : Math.max(6, 16 - i)) + (online ? 0 : Math.min(2, Math.floor(streak / 4)));
const loseTP = (i, online) => (online ? 12 : 10) + i;
function rankedResult(win, online) {
  const i = tierOf(tp), next = TIERS[i + 1];
  if (promo && next) {   // 승급전 진행 중
    if (win) promo.w++; else promo.l++;
    let msg;
    if (promo.w >= 2) { tp = next[1]; promo = null; msg = `🎉 승급전 통과! ${next[0]} 승급`; }
    else if (promo.l >= 2) { tp = Math.max(0, next[1] - 40); promo = null; msg = '💥 승급전 실패... 다시 도전하세요'; }
    else msg = `승급전 ${promo.w}승 ${promo.l}패 (3판 2선승)`;
    lsSet('sgf_promo', promo); lsSet('sgf_tp', tp); return msg;
  }
  promo = null;
  if (win) {
    tp += winTP(i, online);
    if (next && tp >= next[1]) { tp = next[1] - 1; promo = { w: 0, l: 0 }; lsSet('sgf_promo', promo); lsSet('sgf_tp', tp); return `🔥 ${next[0]} 승급전 시작! (3판 2선승)`; }
  } else tp = Math.max(0, tp - Math.round(loseTP(i, online) * (cut.revived ? 0.5 : 1)));
  lsSet('sgf_promo', promo); lsSet('sgf_tp', tp); return '';
}
// 매 판 끝: 티어 점수 · 사채 이자 · 랭킹 업로드
function afterMatchEconomy(w) {
  cut.tp = null; cut.interest = 0;
  if (mode !== 1 && mode !== 3) return;
  const me = mode === 1 ? p1 : NET.me, win = w === me, before = tp;
  if (mode === 1 && win) lsSet("sgf_best", Math.max(lsGet("sgf_best", 0), streak));
  if (mode === 1 && ranked) {   // 티어 점수·랭킹 기록은 랭크전에서만
    const res = rankedResult(win, false);
    cut.tp = { before, after: tp, d: tp - before, msg: res };
    if (win) lsSet("sgf_rbest", Math.max(lsGet("sgf_rbest", 0), streak));   // 랭크전 최고 연승
    lsSet("sgf_peak", Math.max(lsGet("sgf_peak", 0), tp));                   // 랭크전 최고 TP
  }
  if (debt > 0) { cut.interest = Math.max(1, Math.ceil(debt * 0.003)); debt += cut.interest; saveDebt(); }
  uploadRank();
}

function updateFighters(frozen) {
  let i1 = EMPTY, i2 = EMPTY;

    if (mode === 3) { i1 = netIn.p1; i2 = netIn.p2; }
    else {
      if (mode === 0 || mode === 4) i1 = cpuInput(p1, p2);
      else i1 = orInput(readInput(MAP1), readInput(MAP2));
      i2 = cpuInput(p2, p1);

  p1.update(i1, p2); p2.update(i2, p1);
  separate(p1, p2);
  if (scene === 'fight') {
    checkHit(p1, p2); checkHit(p2, p1);
    for (const f of [p1, p2]) if (f.hp > 0) f.stats.minHpRatio = Math.min(f.stats.minHpRatio, f.hp / f.maxHp);

function updateSelect() {
  let i = sel.c1;
  if (pressed.KeyA || pressed.ArrowLeft) i = (i + 11) % 12;
  if (pressed.KeyD || pressed.ArrowRight) i = (i + 1) % 12;
  if (pressed.KeyW || pressed.KeyS || pressed.ArrowUp || pressed.ArrowDown) i = (i + 6) % 12;
  if (i !== sel.c1) { sel.c1 = i; SFX.select(); }
  if (pressed.KeyC) { openEditor(); return; }
  if (pressed.KeyI || pressed.KeyJ || pressed.Space || pressed.Enter) {
    if (!getChar(sel.c1)) { openEditor(); return; }
    SFX.confirm();
    if (selFor === 'online') { scene = 'online'; NET.err = ''; } else startRun();
  }
  if (pressed.Escape) { if (selFor === 'online') scene = 'online'; else toTitle(); }
}
function toast(s) { toastMsg = s; toastT = 150; }

function step() {
  gT++;
  if (toastT > 0) toastT--;
  if (scene === 'title') updateTitle();
  else if (scene === 'select') updateSelect();
  else if (scene === 'market') updateMarket();
  else if (scene === 'betpick') updateBetPick();
  else if (scene === 'custom') updateCustom();
  else if (scene === 'online') updateOnline();
  else if (scene === 'ranking') updateRanking();
  else if (scene === 'story') updateStory();
  else if (scene === 'bank') updateBank();
  else if (scene === 'opening') {
    sceneT++; updateOpening();
    if (sceneT >= OPEN_T || pressed.Space || pressed.Enter) { try { speechSynthesis.cancel(); } catch (e) {} nextOpponent(); }
    if (pressed.Escape) toTitle();
  } else if (scene === 'vs' && (mode === 3 || mode === 4)) { if (++sceneT >= (mode === 4 ? 110 : 150)) startMatch(); }
  else if (scene === 'vs') {
    sceneT++;
    const canBet = mode === 1 && coins > 0;
    if (canBet) {
      const old = betSel;
      if (pressed.Digit1 || pressed.Numpad1) betSel = 0; if (pressed.Digit2 || pressed.Numpad2) betSel = 1; if (pressed.Digit3 || pressed.Numpad3) betSel = 2;
      if (pressed.KeyA || pressed.ArrowLeft) betSel = (betSel + 2) % 3; if (pressed.KeyD || pressed.ArrowRight) betSel = (betSel + 1) % 3;
      if (old !== betSel) SFX.select();
    }
    if (sceneT >= (canBet ? 600 : 120) || (sceneT > 20 && (pressed.Space || pressed.Enter || pressed.KeyI))) {
      bet = canBet ? [0, Math.floor(coins / 2), coins][betSel] : 0;
      if (bet > 0) { addCoins(-bet); SFX.stamp(); }
      startMatch();
    }
    if (pressed.Escape) quitRun();
  } else if (scene === 'intro') {
    sceneT++; updateFighters(true);
    if (sceneT === 2) speak(p1.wins === 1 && p2.wins === 1 ? '파이널 라운드!' : `라운드 ${round}!`);
    if (sceneT === 75) { SFX.bell(); speak('파이트!', 1.4); }
    if (sceneT >= 120) scene = 'fight';
  } else if (scene === 'fight') {
    if (superFreeze > 0) superFreeze--;
    else if (hitstop > 0) hitstop--;
    else {
      updateFighters(false);
      if (scene === 'fight') {
        updateObjs(); updateFloor(); updateEvents();
        if (scene === 'fight') {
          timer--;
          if (timer % 60 === 0 && timer <= 600 && timer > 0) SFX.tick();
          if (timer <= 0) timeOver();
        }
      }
    }
    if (pressed.Escape) quitRun();
  } else if (scene === 'roundEnd') {
    sceneT++;
    if (hitstop > 0) hitstop--;
    else if (sceneT > 70 || sceneT % 3 === 0) updateFighters(true);
    if (sceneT === 110 && roundWinner) SFX.stamp();
    if (sceneT >= 230) afterRound();
  } else if (scene === 'cutscene') {
    const on3 = mode === 3, ci = on3 ? (cut.w === p1 ? netIn.p1 : netIn.p2) : null;
    const anyOk = on3 ? netIn.p1.ok || netIn.p2.ok : false;
    if (!cut.chosen && cut.t >= CHOICE_T) { cut.t = CHOICE_T; cut.waiting = true; }
    if (cut.waiting) {
      for (let i = 0; i < 3; i++) if (on3 ? ci['n' + (i + 1)] : (pressed['Digit' + (i + 1)] || pressed['Numpad' + (i + 1)])) { chooseDish(i); break; }
      if (cut.waiting) {
        if (on3 ? ci.leftP : (pressed.KeyA || pressed.ArrowLeft)) { cut.sel = (cut.sel + 2) % 3; SFX.select(); }
        if (on3 ? ci.rightP : (pressed.KeyD || pressed.ArrowRight)) { cut.sel = (cut.sel + 1) % 3; SFX.select(); }
        if (on3 ? ci.ok : (pressed.Enter || pressed.Space || pressed.KeyI)) chooseDish(cut.sel);
        else if ((mode === 0 || mode === 4) && ++cut.waitN > (mode === 4 ? 80 : 20)) chooseDish(Math.random() * 3 | 0);
      }
    } else {
      cut.t += 1 / 60;
      const skip = on3 ? anyOk : pressed.Space, next = on3 ? anyOk : pressed.Enter;
      if (cut.t > T_GRL + 0.6 && next) {

        else if (mode !== 1) toTitle();

        else nextOpponent();
      } else if (skip) {
        if (!cut.chosen) { cut.prev = Math.min(cut.prev, 1.99); cut.t = CHOICE_T; }
        else if (cut.t < T_GRL) { cut.prev = T_GRL - 0.001; cut.t = T_GRL; parts = []; texts = []; }
      }
      if (scene === 'cutscene') updateCutscene();
    }
    if (!on3 && pressed.Escape) quitRun();
  }

  updParts();
  shake = shake > 0.5 ? shake * 0.88 : 0;
  for (const k in pressed) delete pressed[k];
}

function computeGrade(w) {
  const s = w.stats;
  if (s.minHpRatio < 0.15) return { t: '냉동 대패삼겹살', d: '아슬아슬한 대역전승!', stars: 4 };
  if (s.maxCombo >= 6) return { t: '벌집 삼겹살', d: `최대 ${s.maxCombo}콤보의 화려한 칼집`, stars: 5 };
  if (w.hp / w.maxHp >= 0.8 && s.minHpRatio >= 0.5) return { t: '최고급 오겹살', d: '정교하고 깔끔한 승리', stars: 5 };
  if (s.ultFinish) return { t: '직화 불맛 삼겹살', d: '필살기로 마무리!', stars: 5 };
  if (s.parries >= 3) return { t: '드라이에이징 숙성 삼겹', d: `숙성 패링 ${s.parries}회`, stars: 4 };
  if (s.parts >= 3) return { t: '정육 마스터 모둠구이', d: `부위 손질 ${s.parts}회`, stars: 4 };
  return { t: '1등급 생삼겹살', d: '든든한 승리', stars: 3 };
}

    // 커스텀 캐릭터
    openEditor(); for (ed.row = 1; ed.row <= 8; ed.row++) { edChange(1); edChange(1); } draw(); edSave(); draw();
    out.push('custom: ' + JSON.stringify(customDef) + ' hp=' + getChar(10).hp + ' pow=' + getChar(10).power.toFixed(2));
    sel.c1 = 11; draw(); scene = 'online'; draw(); scene = 'title'; draw();
    // 온라인 락스텝 결정성: 같은 시드 + 같은 입력이면 두 번 돌려도 결과가 같아야 한다
    const hsh = (k) => { let x = Math.imul(k ^ 0x9e3779b9, 2654435761) >>> 0; x ^= x >>> 15; return Math.imul(x, 0x85ebca6b) >>> 0; };
    const genIn = (n, side) => {
      const h = hsh(Math.floor(n / 10) * 7 + side), o = { ...EMPTY }, ev = n % 10 === 0;
      o.left = (h & 3) === 1; o.right = (h & 3) === 2; o.down = (h >> 2 & 7) === 0;
      o.leftP = ev && o.left; o.rightP = ev && o.right; o.up = ev && (h >> 5 & 7) === 0;
      if (ev) { const b = ['lp', 'rp', 'lk', 'rk', 'grab', 'skill', 'lp', 'rk'][h >> 8 & 7]; o[b] = true; o.mash = true; }
      if (ev && (h >> 12 & 7) === 0) { o.adCmd = true; o.ult = true; }
      o.ok = n % 240 === 0; o.n1 = n % 50 === 0;
      return o;
    };
    const simRun = seed => {
      mode = 3; NET.me = p1; NET.names = ['A', 'B']; NET.code = '0000';
      p1.setChar(CHARS[3]); p2.setChar(buildCustom({ ...CUSTOM_DEFAULT, skill: 7, ult: 8, acc: 5 }));
      sseed(seed); startMatch(); let r = '';
      for (let n = 0; n < 12000; n++) {
        netIn = { p1: genIn(n, 1), p2: genIn(n, 2) }; step();
        if (n % 400 === 0) r += [scene, p1.hp.toFixed(4), p2.hp.toFixed(4), p1.x.toFixed(3), p2.x.toFixed(3), p1.wins, p2.wins].join(',') + '|';
      }
      return r;
    };
    const r1 = simRun(12345), r2 = simRun(12345), r3 = simRun(999);
    out.push('lockstep determinism: ' + (r1 === r2 ? 'OK' : 'MISMATCH') + ' (다른 시드와 다름: ' + (r1 !== r3) + ')');
    out.push('sim tail: ' + r1.split('|').slice(-4).join(' / '));
    // 사운드 합성 코드 실행 (헤드리스에서도 AudioContext 생성 가능)
    initAudio();
    if (AC) { for (const nm in TRACKS) { const tr = TRACKS[nm]; for (let s = 0; s < 32; s++) scheduleStep(tr, s, AC.currentTime + s * 0.05, 0.05); } for (const k in SFX) SFX[k](); setMusic('fight'); musicTick(); out.push('audio: OK'); }
    else out.push('audio: no AudioContext');
    // AI 베팅 한 판
    coins = 200; openBet(); bet4.side = 0; bet4.amt = 2; draw(); pressed.Enter = true; step();
    out.push('bet: scene=' + scene + ' stake=' + bet4.stake);
    let nb = 0; bet4.fast = true; while (scene !== 'cutscene' && nb < 60 * 60 * 8) { step(); if (nb % 90 === 0) draw(); nb++; }
    let nc = 0; while (scene === 'cutscene' && cut.t < T_GRL + 1 && nc < 3000) { step(); if (nc % 90 === 0) draw(); nc++; }
    out.push(`bet result: winner=${cut.w.base} side=${bet4.side} earn=${JSON.stringify(cut.earn)} coins=${coins}`);
    pressed.Enter = true; step(); out.push('after bet Enter: ' + scene);
    // 시장 · 상점
    fridge = []; addDish(makeDish(MEATS[5].opts[0]), '갈비', 5); addDish(makeDish(MEATS[0].opts[2]), '삼겹살', 2);
    openMarket(); draw(); const c0 = coins; sellDish(0); out.push(`market: sold +${coins - c0}, fridge=${fridge.length}`); mk.tab = 1; draw();
    coins = 2000; for (let i = 0; i < SHOP.length; i++) shopAct(i);
    out.push('shop: own=' + Object.keys(inv.own).join(',') + ' use=' + JSON.stringify(inv.use) + ' coins=' + coins);
    scene = 'title'; draw(); p1.setChar(withCos(CHARS[0])); scene = 'fight'; draw(); scene = 'betpick'; draw();
    // 스토리 · 은행 · 티어 · 랭킹
    for (const k in STORY) { startStory(k); for (let i = 0; i < STORY[k].length; i++) { story.i = i; for (story.t = 1; story.t < 200; story.t += 40) { draw(); } } }
    coins = 5000; debt = 10000; bankDebt = 0; chapSeen = []; scene = 'bank'; draw(); repay('debt', 3000);
    out.push(`repay: debt=${debt} coins=${coins} scene=${scene} chap=${chapSeen.join(',')}`);
    scene = 'bank'; coins = 0; borrow(100); out.push(`loan: bankDebt=${bankDebt} coins=${coins} limit=${loanLimit()}`);
    tp = 720; out.push('tier 720 = ' + TIERS[tierOf(tp)][0]); draw(); openRanking(false); draw(); rk.tab = 1; draw(); scene = 'title'; draw();
    mode = 1;
    out.push('ults used: ' + JSON.stringify(ultCount));



    out.push('AUTOTEST PASS');
  } catch (e) { out.push('ERROR: ' + e.message + '\n' + e.stack); }
  console.log('ATRESULT ' + out.join(' | '));
  const pre = document.createElement('pre'); pre.id = 'r'; pre.textContent = out.join('\n'); document.body.appendChild(pre);
  toTitle();
}

const VIEW = new URLSearchParams(location.search).get('view');   // 스크린샷 확인용
if (VIEW === 'fight') { mode = 0; p1.setChar(withCos(CHARS[0], { hat: 'crown', fx: 'fxfire' })); p2.setChar(CHARS[6]); startMatch(); }
else if (VIEW === 'betpick') openBet();
else if (VIEW === 'market') { if (!fridge.length) { addDish(makeDish(MEATS[5].opts[0]), '갈비', 5); addDish(makeDish(MEATS[2].opts[0]), '등심', 4); addDish(makeDish(MEATS[4].opts[0]), '족', 3); } openMarket(); }
else if (VIEW === 'shop') { openMarket(); mk.tab = 1; }
else if (VIEW === 'bank') { scene = 'bank'; }
else if (VIEW && VIEW.startsWith('story')) { startStory('intro'); story.i = +(VIEW.slice(5) || 0); story.t = 400; }
if (NETTEST) { sel.c1 = NETTEST === 'host' ? 3 : 7; playerName = NETTEST; NET.code = new URLSearchParams(location.search).get('code') || '4321'; scene = 'online'; if (NETTEST === 'host') netHost(); else setTimeout(netJoin, 6000); setInterval(() => console.log('NETSTATUS ' + NET.status + ' | ' + NET.err + ' | f=' + NET.f), 5000); }
if (!location.search && !lsGet('sgf_story_seen', false)) startStory('intro');
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  if (pressed.KeyM) { toggleMute(); delete pressed.KeyM; }
  if (pressed.KeyF && mode === 4) { bet4.fast = !bet4.fast; delete pressed.KeyF; }
  while (acc >= 1000 / 60) {
    if (mode === 3 && NET.ready) netTick();
    else { const ff = mode === 4 && bet4.fast && ['intro', 'fight', 'roundEnd'].includes(scene) ? 3 : 1; for (let r = 0; r < ff; r++) step(); }
    acc -= 1000 / 60;
  }

  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>

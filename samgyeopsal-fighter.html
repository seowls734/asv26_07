<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>삼겹살 파이터 — 철판 대난투</title>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 0 40px #000}
#r{position:absolute;left:0;top:0;color:#fff;background:#000c;font:12px monospace;margin:0;padding:8px;white-space:pre-wrap}
#pad{position:fixed;top:0;bottom:env(safe-area-inset-bottom);left:env(safe-area-inset-left);right:env(safe-area-inset-right);pointer-events:none;display:none;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif}
#pad .b{position:absolute;pointer-events:auto;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.45);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;text-align:center;line-height:1.1;text-shadow:0 1px 2px #000}
#pad .b.on{background:rgba(255,200,80,.55)}
#pad .c{border-radius:14px;background:rgba(255,120,80,.28);font-size:12px}
#pad .c.off{opacity:.38}
#pad .c.rdy{background:rgba(255,193,7,.6);border-color:#fff59d;box-shadow:0 0 14px #ffd54f}
#joyz{position:absolute;pointer-events:auto;touch-action:none}
#joyb{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.07);pointer-events:none}
#auth{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(10,5,20,.72);z-index:50;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;-webkit-user-select:text;user-select:text;touch-action:auto}
#auth .box{width:min(340px,88vw);max-height:92vh;overflow:auto;background:#2b1622;border:2px solid #ff8fab;border-radius:18px;padding:18px 20px;color:#fff;text-align:center;box-shadow:0 0 40px #000}
#auth h2{margin:2px 0 6px;font-size:22px;color:#ffc1d0}
#auth p{margin:0 0 12px;font-size:14px;color:#ffe0b2}
#auth small{display:block;margin:8px 0;font-size:12px;color:#d7b8c4;line-height:1.4}
#auth input{display:block;box-sizing:border-box;width:100%;margin:7px 0;padding:11px 12px;border-radius:10px;border:2px solid #6d3b52;background:#1a0d14;color:#fff;font-size:16px;outline:none}
#auth input:focus{border-color:#ff8fab}
#auth button{display:block;width:100%;margin:8px 0 0;padding:12px;border:0;border-radius:12px;background:#ff5c8a;color:#fff;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit}
#auth button.sub{background:rgba(255,255,255,.14);font-weight:700}
#auth button:disabled{opacity:.5}
#auth #gbtn{display:flex;justify-content:center;min-height:44px;margin:4px 0}
#auth .or{margin:6px 0 -2px;font-size:12px;color:#d7b8c4}
#auth .gok{color:#a5d6a7}
#auth .err{min-height:18px;margin-top:6px;font-size:13px;color:#ff8a80}
#joyk{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.38);border:2px solid rgba(255,255,255,.6);pointer-events:none}
</style>
</head>
<body>

<div id="pad"></div>

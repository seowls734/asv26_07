<style>

#auth p{margin:0 0 12px;font-size:14px;color:#ffe0b2}

<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="pad"></div>
<script>
'use strict';
const cv = document.getElementById('c');

// 모바일 웹: 기기에 맞는 전체 화면, 길게 눌러 메뉴 뜨는 것 막기, 앱 전환 시 소리 멈춤

const inAuth = e => e.target && e.target.closest && e.target.closest('#auth');
document.addEventListener('gesturestart', e => e.preventDefault());

// ================= utils =================

// 글자가 maxW보다 넓으면 들어가도록 글자 크기를 줄여서 돌려줌 (최소 9px)
function fitSize(s, size, maxW) { ctx.font = `900 ${size}px ${FONT}`; const w = ctx.measureText(s).width; return w > maxW ? Math.max(9, Math.floor(size * maxW / w)) : size; }
function txt(s, x, y, size, fill, stroke = '#000', lw = 6, align = 'center') {

// 받침 유무로 은/는, 이/가 선택

// ================= input =================
const keys = {}, pressed = {}, lastPress = {};
let ginOpen = false;   // 게임 안 글자 입력 창이 떠 있으면 게임 조작 무시
function press(code) { if (!keys[code]) { pressed[code] = true; lastPress[code] = gT; } keys[code] = true; }
addEventListener('keydown', e => {
  if (authShown || ginOpen) return;   // 로그인 창 · 글자 입력 창이 떠 있으면 게임 조작 무시

addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const MAP1 = { left: 'KeyA', right: 'KeyD', up: 'KeyW', down: 'KeyS', lp: 'KeyI', rp: 'KeyO', lk: 'KeyK', rk: 'KeyL', grab: 'KeyJ', skill: 'KeyU', ultD: 'KeyY', tf: 'KeyT' };   // J 업어치기 · U 스킬 · Y 필살기 (한 번에 누르는 단축키)

const EMPTY = { tf: false, ultD: false, left: false, right: false, up: false, down: false, leftP: false, rightP: false, lp: false, rp: false, lk: false, rk: false, grab: false, skill: false, ult: false, adCmd: false, cpu: false, mash: false, n1: false, n2: false, n3: false, ok: false };

let hot = [];

const PAD = [   // 공격 버튼 4개 + 업어치기·스킬·필살기 버튼 (조이스틱 커맨드 ↓→ · ↓← · →→ + 공격도 그대로 됨)

    c.hp = Math.round(B.hp * p('hp')); c.power = B.power * p('power'); c.speed = B.speed * p('speed'); c.ultRate = B.ultRate * p('ultRate');
    c.skill.cd = Math.round(B.cds[0] * p('cd')); (c.skills || []).forEach((s, j) => { s.cd = Math.round(B.cds[j + 1] * p('cd')); });

    if (isMember() && d.saved === undefined && ++cfgN % 2 === 0 && !pendingSave && !pushing && !cloudTimer) cloudPull();   // 옛 서버(계정 시각을 안 줌)면 20초마다 직접 확인

// ================= particles =================
let parts = [], texts = [];
function burst(x, y, n, cols, spd = 10) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rand(spd * 0.3, spd);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: rand(15, 30), max: 30, c: cols[i % cols.length], s: rand(2, 5), g: 0.35, type: 'dot', glow: true });
  }
}
function smoke(x, y, c = '220,220,220') { parts.push({ x, y, vx: rand(-0.4, 0.4), vy: rand(-1.8, -0.8), life: rand(50, 90), max: 90, c, s: rand(8, 16), g: -0.005, type: 'smoke' }); }
function smokePuff(x, y) { for (let i = 0; i < 10; i++) smoke(x + rand(-30, 30), y + rand(-40, 40), '120,100,150'); }
function flame(x, y) { parts.push({ x, y, vx: rand(-0.6, 0.6), vy: rand(-2.5, -1), life: rand(15, 25), max: 25, c: pick(['#ff9800', '#ffeb3b', '#ff5722']), s: rand(3, 6), g: -0.05, type: 'dot', glow: true }); }
function slash(x, y) { parts.push({ x, y, a: rand(0, Math.PI), len: rand(80, 160), life: 12, max: 12, type: 'slash', vx: 0, vy: 0, g: 0 }); }
function popText(x, y, s, c, size = 36) { texts.push({ x, y, s, c, size, life: 50, max: 50 }); }
function updParts() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--; if (p.type === 'smoke') { p.s += 0.35; p.vx *= 0.99; } if (p.type === 'ring') p.r += 4.5; }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 600) parts.splice(0, parts.length - 600);
  for (const t of texts) { t.life--; t.y -= 0.6; }
  texts = texts.filter(t => t.life > 0);
}
function drawParts() {
  for (const p of parts) {
    const a = clamp(p.life / p.max);
    if (p.type === 'smoke') { ctx.fillStyle = `rgba(${p.c},${a * 0.35})`; ell(p.x, p.y, p.s, p.s); ctx.fill(); }
    else if (p.type === 'slash') {
      ctx.strokeStyle = `rgba(255,255,255,${a})`; ctx.lineWidth = 4 * a + 1;
      const dx = Math.cos(p.a) * p.len / 2, dy = Math.sin(p.a) * p.len / 2;
      line(p.x - dx, p.y - dy, p.x + dx, p.y + dy);
    } else if (p.type === 'ring') { ctx.strokeStyle = `rgba(${p.c},${a})`; ctx.lineWidth = 6 * a + 1; ell(p.x, p.y, p.r, p.r * 0.8); ctx.stroke(); }
    else {
      ctx.globalAlpha = a; if (p.glow) ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = p.c; ell(p.x, p.y, p.s, p.s); ctx.fill();
      if (p.glow) { ctx.globalAlpha = a * 0.3; ell(p.x, p.y, p.s * 2.4, p.s * 2.4); ctx.fill(); ctx.globalCompositeOperation = 'source-over'; }
      ctx.globalAlpha = 1;
    }

  }
  for (const t of texts) {
    const k = 1 - t.life / t.max;
    const sc = k < 0.15 ? 0.5 + k / 0.15 * 0.7 : 1.2 - Math.min(0.2, k - 0.15);
    ctx.save(); ctx.globalAlpha = clamp(t.life / 15); ctx.translate(t.x, t.y); ctx.scale(sc, sc); ctx.rotate(-0.08);
    txt(t.s, 0, 0, t.size, t.c, '#000', 7); ctx.restore();
  }
}

const backLookCache = new WeakMap();
// 별 모양 경로 (x, y 중심, r 바깥 반지름, ri 안쪽 반지름)
function star(x, y, r, ri) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? ri : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); }
function shadeHex(c, k) {
  if (typeof c !== 'string' || !/^#[0-9a-f]{6}$/i.test(c)) return c;
  const v = [1, 3, 5].map(i => Math.min(255, Math.round(parseInt(c.slice(i, i + 2), 16) * k)));   // k>1이면 밝게
  return '#' + v.map(x => x.toString(16).padStart(2, '0')).join('');
}
function shadeLook(C) {
  let s = backLookCache.get(C);
  if (!s) { s = { ...C, body: shadeHex(C.body, 0.82), dark: shadeHex(C.dark, 0.82), hoof: shadeHex(C.hoof, 0.82) }; backLookCache.set(C, s); }
  return s;
}
let LWM = 1;   // 돼지 외곽선 굵기 배수
function limb(x1, y1, x2, y2, w, C, hc, hr) {
  ctx.lineCap = 'round';
  ctx.strokeStyle = C.dark; ctx.lineWidth = w + 4 * LWM; line(x1, y1, x2, y2);
  ctx.strokeStyle = C.body; ctx.lineWidth = w; line(x1, y1, x2, y2);
  ctx.fillStyle = hc || C.hoof; ell(x2, y2, hr || w / 2 + 1, hr || w / 2 + 1); ctx.fill();
  if (hc) { ctx.strokeStyle = 'rgba(0,0,0,0.35)'; ctx.lineWidth = 2; ctx.stroke(); }
}

const pigFxC = document.createElement('canvas'), pigFxX = pigFxC.getContext('2d');
// 🟦 픽셀 아트로 그리기 (볼트돈만): 작은 캔버스에 낮은 해상도로 그린 뒤 부드럽게 하지 않고 크게 늘림 → 도트 그림처럼
// x0,y0,w,h: 지금 좌표계에서 그릴 범위 · fn: 그 안에 그리는 함수
const pxC = document.createElement('canvas'), pxX = pxC.getContext('2d'); const pxO = document.createElement('canvas'), pxOX = pxO.getContext('2d'); let pxOn = false;
function pixelate(x0, y0, w, h, fn, dot = 2.4) {
  if (pxOn) return fn();
  const m = ctx.getTransform(), pts = [[x0, y0], [x0 + w, y0], [x0, y0 + h], [x0 + w, y0 + h]].map(([x, y]) => [m.a * x + m.c * y + m.e, m.b * x + m.d * y + m.f]);
  const bx = Math.floor(Math.min(...pts.map(p => p[0]))), by = Math.floor(Math.min(...pts.map(p => p[1]))), bw = Math.ceil(Math.max(...pts.map(p => p[0]))) - bx, bh = Math.ceil(Math.max(...pts.map(p => p[1]))) - by;
  const P = Math.max(2, dot * Math.hypot(m.a, m.b));   // 도트 한 칸 = 화면 픽셀 몇 개
  const cw = Math.max(1, Math.ceil(bw / P)), ch = Math.max(1, Math.ceil(bh / P));
  if (cw > 1200 || ch > 1200) return fn();
  if (pxC.width < cw || pxC.height < ch) { pxC.width = Math.max(pxC.width, cw); pxC.height = Math.max(pxC.height, ch); }
  pxX.setTransform(1, 0, 0, 1, 0, 0); pxX.clearRect(0, 0, pxC.width, pxC.height); pxX.globalAlpha = 1;
  pxX.setTransform(m.a / P, m.b / P, m.c / P, m.d / P, (m.e - bx) / P, (m.f - by) / P);
  const main = ctx; ctx = pxX; pxOn = true;

  if (pxO.width < cw + 2 || pxO.height < ch + 2) { pxO.width = Math.max(pxO.width, cw + 2); pxO.height = Math.max(pxO.height, ch + 2); }

const RAW = { meat: [236, 112, 124], fat: [253, 238, 232], skin: [244, 186, 176] };

  cook = clamp(cook);
  const r = Math.min(10, h * 0.25, w * 0.25);

  const layers = [['skin', 0.1], ['fat', 0.22], ['meat', 0.24], ['fat', 0.14], ['meat', 0.3]];

  for (const [k, f] of layers) {

    ctx.beginPath(); ctx.moveTo(x, yy);
    for (let xx = 0; xx <= w + 8; xx += 8) ctx.lineTo(x + xx, yy + Math.sin((x + xx) * 0.06 + yy) * h * 0.03);
    ctx.lineTo(x + w, y + h); ctx.lineTo(x, y + h); ctx.closePath(); ctx.fill();
    yy += h * f;
  }
  if (marks > 0) {
    ctx.strokeStyle = `rgba(50,20,5,${0.55 * marks})`; ctx.lineWidth = Math.max(3, h * 0.12);
    for (let xx = x - h; xx < x + w; xx += 26) line(xx, y + h, xx + h * 0.8, y);
  }
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(x, y, w, h * 0.12);
  if (cook > 0.3) { ctx.fillStyle = 'rgba(255,255,230,0.5)'; for (let i = 0; i < w / 40; i++) { ell(x + 12 + i * 40, y + h * 0.45 + (i % 2) * h * 0.2, 3, 1.6); ctx.fill(); } }
  ctx.restore();
  ctx.strokeStyle = mixC([200, 90, 100], [90, 45, 20], cook); ctx.lineWidth = 2;

}

// ================= CPU =================
function skillGood(t, dist, op) {
  if (t === 'fireProj') return dist > 220 && dist < 400;   // 포물선: 이 정도 거리에 떨어짐
  if (t === 'iceProj' || t === 'stewSplash') return dist > 200;
  if (t === 'boneSwing') return dist > 120 && dist < 230;
  if (t === 'teleport') return true;
  if (t === 'boomerang') return dist > 150 && dist < 460;   // 냉삼 부메랑: 떨어진 상대에게
  if (t === 'coinToss') return dist < 340;   // 돈뿌리기: 가까이서
  if (t === 'spiritRush') return dist < 420;   // 뚱타플레티나 러시: 수호령이 날아가서 때림 (방어 무시)
  if (t === 'uppercut') return dist < 170;
  if (t === 'launcher') return dist > 90 && dist < 180;   // 엄니 걸기: 조금 떨어진 상대를 끌어당김
  if (t === 'counter') return op.state === 'attack' || dist < 170;
  return dist < 260;
}
// CPU 콤보 순서 (첫 공격이 맞은 뒤 이어서 누를 버튼들)
const CPU_COMBOS = [['rp', 'rk'], ['lp', 'rp', 'rk'], ['lp', 'lk', 'skill'], ['lk', 'rp', 'skill'], ['lp', 'lp', 'rp', 'rk'], ['c_lk', 'rp', 'rk'], ['rp', 'skill']];
function cpuInput(me, op) {
  const inp = { ...EMPTY }, ai = me.ai, L = me.cpuLv;
  // 연승이 쌓일수록(레벨↑) 반응·패링·콤보 확률이 올라간다
  const pGuard = Math.min(0.6, 0.2 + 0.03 * L), pParry = Math.min(0.2, 0.03 + 0.012 * L), pChain = Math.min(0.6, 0.2 + 0.025 * L);   // 밸런스 패치: 너무 잘 막고 콤보가 길어서 낮춤
  if (me.state === 'grabbing') { inp.mash = Math.random() < Math.min(0.6, 0.25 + 0.02 * L); return inp; }
  const dx = op.x - me.x, dist = Math.abs(dx), dir = Math.sign(dx) || 1;
  const bk = dir > 0 ? 'left' : 'right';
  if (me.state === 'blockstun') { inp[bk] = true; inp.down = ai.low; return inp; }
  if (['ko', 'grabbed', 'locked', 'down', 'hit', 'parried', 'transforming', 'ult'].includes(me.state)) return inp;
  if (me.state === 'attack') {
    // 콤보: 첫 공격이 맞으면 정해 둔 콤보 순서대로 다음 버튼을 누름 (입력 기억 덕분에 맞은 순간 눌러도 이어짐)
    if (me.atkHit && !me.atk.skill && !me.atk.grab) {
      if (!ai.route && me.chain === 0) ai.route = Math.random() < pChain ? pick(CPU_COMBOS) : [];
      const nx = ai.route && ai.route[me.chain];
      if (nx && ai.pressedAt !== me.chain) {
        ai.pressedAt = me.chain;
        if (nx === 'skill') { if (me.skillCD <= 0) inp.skill = true; else inp.rk = true; }
        else if (nx.startsWith('c_')) { inp.down = true; inp[nx.slice(2)] = true; }
        else inp[nx] = true;
      }
    }
    return inp;
  }
  ai.route = null; ai.pressedAt = -1;
  if (op.state === 'attack' && op.atk && !op.atk.proj && op.af === op.atk.startup - 3 && dist < 220 && Math.random() < pParry) { inp[bk] = true; inp[bk + 'P'] = true; return inp; }
  if (ai.guard > 0) { ai.guard--; inp[bk] = true; inp.down = ai.low; return inp; }
  if (op.state === 'attack' && op.atk && op.af <= 2 && dist < 240 && Math.random() < pGuard) { ai.guard = op.atk.startup + (op.atk.active || 1) + 4; ai.low = op.atk.height === 'low'; }
  if (op.state === 'ult' && op.uT < 3 && Math.random() < 0.35) { ai.guard = 40; ai.low = op.ch.ult.type === 'stampede'; }
  for (const o of objs) if (o.owner === op && o.dmg && !o.delay && Math.abs(o.x - me.x) < 180 && Math.random() < 0.06) {
    if (o.height === 'low') inp.up = true; else { ai.guard = 12; ai.low = false; }
  }
  if (temps[tileOf(me.x)] >= 70 && ai.move === 0) { ai.move = (me.x < W / 2 ? 1 : -1) * 30; if (Math.random() < 0.3) inp.up = true; }
  if (--ai.think <= 0) {
    ai.think = Math.max(5, 10 - L * 0.3) + (Math.random() * Math.max(8, 18 - L * 0.6) | 0);   // 밸런스 패치: 생각 간격을 늘려 덜 몰아붙이게
    const r = Math.random();
    if (me.meter >= 100 && dist < ULT_RANGE[me.ch.ult.type] && r < 0.5) { inp.ult = true; inp.cpu = true; }
    else if (me.skillCD <= 0 && r < 0.35 && skillGood(me.ch.skill.type, dist, op)) inp.skill = true;
    else if (dist < 130 && r < 0.12) inp.grab = true;
    else if (dist < 200) {
      const q = Math.random();
      if (q < 0.22) inp.lp = true; else if (q < 0.42) inp.rp = true; else if (q < 0.58) inp.lk = true; else if (q < 0.72) inp.rk = true;
      else if (q < 0.8) { inp.down = true; inp[pick(['lp', 'rp', 'lk', 'rk'])] = true; }
      else if (q < 0.9) ai.move = -dir * 16; else inp.up = true;
    } else { ai.move = dir * (14 + (Math.random() * 24 | 0)); if (r < 0.06) inp.up = true; }
  }
  if (ai.move !== 0) { const sg = Math.sign(ai.move); inp[sg > 0 ? 'right' : 'left'] = true; ai.move -= sg; }
  return inp;
}

// ================= 랭킹 서버 (Firebase Realtime Database 여러 개) =================
// 첫 번째가 원래 서버(주소 그대로). 아래 RANK_EXTRA에 Firebase 주소를 넣으면 같은 기록을 모든 서버에 함께 저장하고,
// 불러올 때는 모든 서버를 합쳐서(같은 사람은 가장 최근 기록) 보여 줌 → 서버 하나가 죽어도 랭킹이 유지됨
const RANK_MAIN = 'https://samgyeopsal-fighter-default-rtdb.asia-southeast1.firebasedatabase.app';
const RANK_EXTRA = [
  'https://samgyeopsal-fighter-2-default-rtdb.asia-southeast1.firebasedatabase.app',   // 2번째 Firebase
  'https://samgyeopsal-fighter-3-default-rtdb.asia-southeast1.firebasedatabase.app',   // 3번째 Firebase
  'https://samgyeopsal-rank.123eet7-1fe.workers.dev'                                   // 4번째: Cloudflare Workers + D1
];
// 테스트(내 컴퓨터 파일로 열기 · ?autotest 등 주소 옵션)에서는 실제 랭킹 서버에 올리지 않음
const RANK_TEST = location.protocol === 'file:' || /autotest|view=|shot=|nettest/i.test(location.search);
const RANK_DBS = RANK_TEST ? [] : [RANK_MAIN, ...RANK_EXTRA].map(s => s.trim().replace(/\/+$/, '')).filter(Boolean);
const rankAll = (path, opt) => Promise.allSettled(RANK_DBS.map(db => fetch(`${db}${path}`, opt).then(r => { if (!r.ok) throw r.status; return r; })));
let pid = lsGet('sgf_pid', null);
if (!pid) { pid = Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); lsSet('sgf_pid', pid); }
// tab 0 = 티어 랭킹, 1 = 연승 랭킹, 2 = 내 기기 기록. 한 쪽에 10명, 최대 100위
const rk = { tab: 0, all: [], list: null, err: '', loading: false, page: 0 };
function rankSort() {
  const a = rk.all.slice();
  if (rk.tab === 1) a.sort((x, y) => (y.streak || 0) - (x.streak || 0) || y.tp - x.tp);
  else a.sort((x, y) => y.tp - x.tp || (y.streak || 0) - (x.streak || 0));
  rk.list = a.slice(0, 100); rk.page = 0;
}
function uploadRank() {
  if (IS_TESTER) return Promise.resolve();   // 테스트 계정은 랭킹에 안 올림
  // 티어는 지금 티어(떨어지면 순위도 내려감), 연승은 랭크전 최고 연승(오르기만 함). 랭크전을 안 해 봤으면 올리지 않음
  // 게스트는 랭킹에 올리지 않음. 회원은 계정 번호(uid)로 올림 → 어느 기기에서 해도 같은 줄
  if (!RANK_DBS.length || !isMember() || !lsGet('sgf_ranked', false)) return Promise.resolve();
  const body = { name: playerName.slice(0, 16), tier: tierOf(tp), tp, streak: lsGet('sgf_rbest', 0), t: Date.now() };
  return rankAll(`/rank/${auth.uid}.json`, { method: 'PUT', body: JSON.stringify(body) });
}
// 계정 기능 전에 이 기기 번호(pid)로 올라가 있던 옛 랭킹 기록은 한 번 지움 (게스트 선택 또는 로그인 때)
function dropLegacyRank() {
  try { if (localStorage.getItem('sgf_pidDropped')) return; localStorage.setItem('sgf_pidDropped', '1'); } catch (e) { return; }
  if (RANK_DBS.length) rankAll(`/rank/${pid}.json`, { method: 'DELETE' });
}
// 랭킹 불러오기는 서버 하나에서만 함(저장은 모든 서버에). 시작 서버를 무작위로 골라 부담을 나누고, 실패하면 다음 서버로.
// 서버에서는 티어 상위·연승 상위 RANK_TOP명씩만 받음 → 플레이어가 늘어도 내려받는 양이 그대로.
// 서버에 색인(.indexOn)이 없어 상위만 받기가 실패하면 그 서버에서 전체를 받음.
const RANK_TOP = 150;
function rankGet(db) {
  const opt = typeof AbortSignal !== 'undefined' && AbortSignal.timeout ? { signal: AbortSignal.timeout(6000) } : {};   // 응답 없는 서버는 6초 뒤 포기
  const get = q => fetch(`${db}/rank.json${q}`, opt).then(r => { if (!r.ok) throw r.status; return r.json(); });
  const top = k => get(`?orderBy=%22${k}%22&limitToLast=${RANK_TOP}`);
  return Promise.all([top('tp'), top('streak')]).then(([a, b]) => ({ ...(a || {}), ...(b || {}) }), () => get(''));
}
function fetchRank() {
  if (!RANK_DBS.length) { rk.loading = false; rk.err = '온라인 랭킹 서버가 아직 연결되지 않았어요'; return; }
  rk.loading = true; rk.err = '';
  const s = Math.floor(Math.random() * RANK_DBS.length);
  const tryAt = i => i >= RANK_DBS.length ? Promise.reject(0) : rankGet(RANK_DBS[(s + i) % RANK_DBS.length]).catch(() => tryAt(i + 1));
  tryAt(0).then(d => {   // 빈 랭킹은 null이라 정상
    rk.all = Object.entries(d || {}).filter(([, v]) => v && typeof v.tp === 'number' && (v.tp > 0 || v.streak > 0))   // 랭크전 기록이 없는 돼지는 숨김
      .map(([id, v]) => ({ ...v, id }));
    rankSort(); rk.loading = false;
  }).catch(() => { rk.loading = false; rk.err = '랭킹을 불러오지 못했어요 (인터넷 확인)'; });
}
function openRanking(local) { rk.tab = local ? 2 : 0; if (!local) rankPos = -1; scene = 'ranking'; rk.loading = true; uploadRank().finally(fetchRank); }   // 내 기록을 올린 뒤에 불러와야 최신 순위가 보임
function updateRanking() {
  for (let t = 0; t < 3; t++) if ((pressed["Digit" + (t + 1)] || pressed["Numpad" + (t + 1)]) && rk.tab !== t) { rk.tab = t; if (t < 2) rankSort(); SFX.select(); }
  if (pressed.KeyR) fetchRank();
  const pages = Math.max(1, Math.ceil((rk.list || []).length / 10));
  if (rk.tab < 2 && (pressed.KeyA || pressed.ArrowLeft) && rk.page > 0) { rk.page--; SFX.select(); }
  if (rk.tab < 2 && (pressed.KeyD || pressed.ArrowRight) && rk.page < pages - 1) { rk.page++; SFX.select(); }
  if (pressed.Enter || pressed.Escape || pressed.Space) toTitle();
}

  step = () => {};
  const jobs = []; for (let i = 0; i < CN; i++) for (let j = 0; j < CN; j++) if (i !== j) for (let r = 0; r < N; r++) jobs.push([i, j]);
  const win = Array(CN).fill(0), game = Array(CN).fill(0), vs = CHARS.map(() => Array(CN).fill(0)), len = []; let q = 0;
  const out = document.createElement('pre'); out.id = 'balsim'; document.body.appendChild(out);

  const chunk0 = () => {
    const t0 = performance.now();
    while (q < jobs.length && performance.now() - t0 < 200) {
      const [i, j] = jobs[q++]; mode = 0; p1.setChar(CHARS[i]); p2.setChar(CHARS[j]); startMatch();
      let fr = 0; const ts0 = performance.now(); while (scene !== 'roundEnd' && fr < 15000) { realStep(); fr++; } window.__st = (window.__st || 0) + performance.now() - ts0;
      len.push(fr); game[i]++; game[j]++;
      if (roundWinner === p1) { win[i]++; vs[i][j]++; } else if (roundWinner === p2) { win[j]++; vs[j][i]++; } else { win[i] += 0.5; win[j] += 0.5; }
      scene = 'title'; objs = [];
    }
    if (q < jobs.length) { out.textContent = `progress ${q}/${jobs.length} last=${len[len.length-1]} stepms=${Math.round(window.__st)} pop=${!!POP} scene=${scene} ${CHARS[jobs[q-1][0]].name}-${CHARS[jobs[q-1][1]].name}`; return setTimeout(chunk, 0); }
    const rows = CHARS.map((c, i) => [c.name, win[i] / game[i]]).sort((a, b) => b[1] - a[1]);
    out.textContent = 'BALSIM DONE avgFrames ' + Math.round(len.reduce((a, b) => a + b, 0) / len.length) + '\n' + rows.map(r => `${r[0]}\t${(r[1] * 100).toFixed(1)}%`).join('\n') + '\nVS\n' + CHARS.map((c, i) => c.name + '\t' + vs[i].join(',')).join('\n');
    console.log(out.textContent);
  };
  setTimeout(chunk, 0);
}
